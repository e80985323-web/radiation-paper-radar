<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Research Paper Daily：每日精选辐射探测、闪烁体、能谱、成像与读出相关科研论文。">
    <title>Research Paper Daily</title>
    <link rel="icon" type="image/svg+xml" href="./detector-icon.svg?v=detector-icon-20260915-2">
    <link rel="stylesheet" href="./styles.css?v=card-no-rules-20260916">
  </head>
  <body>
    <div class="site-shell">
      <main>
        <section class="topic-strip" id="topics" aria-label="研究主题">
          <div class="container topic-nav">
            <span class="topic-label">探索主题</span>
            <details id="topic-menu" class="topic-menu">
              <summary><span id="topic-current">全部</span><span class="topic-chevron" aria-hidden="true">▾</span></summary>
              <div id="tag-filters" class="tag-filters" aria-live="polite"></div>
            </details>
            <div id="tag-preview" class="tag-preview" aria-label="常用研究主题"></div>
            <div class="compact-hero" id="today">
              <h1>Research <em>Paper Daily</em></h1>
              <div class="hero-actions">
                <a class="primary-link" href="#papers">浏览今日精选 <span aria-hidden="true">↓</span></a>
              </div>
            </div>
          </div>
        </section>

        <section class="container dashboard" id="papers" aria-live="polite">
          <div class="filter-bar">
            <div class="section-title">
              <h2>精选论文</h2>
              <span id="result-count" class="result-count">—</span>
              <span id="report-status" class="report-status">—</span>
              <a class="history-jump" href="#history">历史日报</a>
            </div>
            <div class="filter-controls">
              <label class="search-box" for="search-input">
                <span class="search-icon" aria-hidden="true">⌕</span>
                <span class="sr-only">快速检索</span>
                <input id="search-input" type="search" placeholder="搜索标题、期刊、方法…" autocomplete="off">
              </label>
              <label class="date-box" for="date-select">
                <span class="sr-only">日报日期</span>
                <select id="date-select" class="field-control"></select>
              </label>
              <button id="reset-button" class="reset-button" type="button">重置</button>
            </div>
          </div>

          <div id="error-banner" class="error-banner" hidden></div>
          <div id="featured-paper" class="featured-paper" hidden></div>
          <div id="paper-grid" class="paper-grid"></div>
          <div id="empty-state" class="empty-state" hidden>当前筛选条件下没有匹配论文。</div>

          <section id="ideas-section" class="ideas-section" hidden>
            <div class="ideas-heading">
              <h2>可检验的研究思路</h2>
            </div>
            <div id="ideas-list" class="ideas-list"></div>
          </section>

          <div class="audit-columns">
            <section id="appendix" class="appendix-section" aria-labelledby="appendix-title">
              <div class="appendix-heading">
                <div>
                  <p class="section-kicker">PROVENANCE</p>
                  <h2 id="appendix-title">来源与复核</h2>
                </div>
                <span>本期检索摘要</span>
              </div>
              <div id="appendix-stats" class="appendix-stats"></div>
            </section>

            <section id="history" class="history-section" aria-labelledby="history-title">
              <div class="section-heading history-heading">
                <div>
                  <p class="section-kicker">ARCHIVE</p>
                  <h2 id="history-title">历史日报</h2>
                </div>
                <span>按日期回看已发布内容</span>
              </div>
              <div id="history-list" class="history-list"></div>
            </section>
          </div>

          <footer class="site-footer">
            <span>摘要仅作阅读导航 · 原文链接可追溯</span>
            <span id="updated-at">—</span>
          </footer>
        </section>
      </main>
    </div>
    <script type="module" src="./app.js?v=card-no-rules-20260916"></script>
  </body>
</html>
